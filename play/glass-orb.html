<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Lindsey Ma · Play" />
  <title>Play · Lindsey Ma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <!-- Reuse the exact visual/layout system of the home page. -->
  <link rel="stylesheet" href="../stylesheet.css">

  <style>
    :root {
      color-scheme: light;
    }

    body {
      overflow-x: hidden;
    }

    .play-back {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 30;
      color: inherit;
      text-decoration: none;
      font: 400 22px/1 Lato, sans-serif;
      opacity: .62;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .play-back:hover,
    .play-back:focus-visible {
      opacity: 1;
      transform: translateY(2px);
    }

    .play-copy p {
      max-width: 34rem;
    }

    /*
      ASTRA MOUNT POINT
      -----------------
      Keep this element inside .intro-photo.

      This is the exact right-hand layout slot occupied by the portrait on the
      home page. Astra should mount the WebGPU / Three.js experience here,
      rather than positioning the initial sphere with hard-coded viewport
      coordinates.

      The mount point itself is intentionally invisible and unstyled.
      Astra may create its canvas/renderer inside it and may render outside
      these bounds when the fracture simulation needs the full viewport.
    */
    #play-experience {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-width: 150px;
    }
  </style>
</head>

<body>
  <a class="play-back" href="../" aria-label="Back home" title="Back home">↓</a>

  <main class="site-shell">
    <header class="intro">
      <div class="intro-copy play-copy">
        <h1>Play</h1>
        <p>
          A small space for things that do not need to be useful.
        </p>
      </div>

      <!--
        IMPORTANT:
        Do not remove .intro-photo or move this mount point elsewhere.

        The home page portrait uses this same .intro-photo layout slot.
        The initial 3D object should therefore derive its screen position
        and size from #play-experience / .intro-photo.

        Astra owns everything inside #play-experience.
      -->
      <div class="intro-photo">
        <div
          id="play-experience"
          aria-label="Interactive Play experience"
        ></div>
      </div>
    </header>
  </main>

  <!--
    Intentionally empty.

    Previous Three.js sphere, materials, lights, scatter animation,
    fallback orb, canvas, and interaction code have been removed.

    Astra: implement the new rendering + physics architecture from scratch.
    Do not restore the previous orb implementation.
  -->
</body>
</html>
