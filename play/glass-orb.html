<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Lindsey Ma · Play" />
  <title>Play · Lindsey Ma</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs">

  <link rel="stylesheet" href="../stylesheet.css">

  <style>
    :root { color-scheme: light; }

    html, body {
      transition: background-color 700ms ease, color 700ms ease;
    }
    body { overflow-x: hidden; }

    /* The room: one fixed canvas behind the page. The page is the back wall. */
    #disco-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100lvh;
      z-index: 0;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 900ms ease;
    }
    #disco-stage.is-ready { opacity: 1; }

    .site-shell { position: relative; z-index: 1; }

    .play-back {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 30;
      color: inherit;
      text-decoration: none;
      font: 400 22px/1 Lato, sans-serif;
      opacity: .62;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .play-back:hover,
    .play-back:focus-visible { opacity: 1; transform: translateY(2px); }

    .play-copy p { max-width: 34rem; }
    .play-hint { color: var(--muted); }

    .play-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 4px;
      margin-top: 14px;
    }
    .play-controls button {
      appearance: none;
      border: 0;
      background: none;
      padding: 2px 6px;
      font: inherit;
      color: var(--link);
      cursor: pointer;
    }
    .play-controls button:hover,
    .play-controls button:focus-visible { color: var(--link-hover); }
    .play-controls [hidden] { display: none; }
    .play-controls .sep { color: #999; user-select: none; }

    /*
      Layout slot shared with the portrait on the home page. The ball's
      resting position and size are derived from this element at runtime.
    */
    #play-experience {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-width: 150px;
    }

    /* Lights off: the room goes dark so the reflected light becomes visible. */
    html.lights-off,
    html.lights-off body { background: #07070a; color: #d9d9de; }
    html.lights-off { color-scheme: dark; }
    html.lights-off .play-hint { color: #8a8a93; }
    html.lights-off .play-controls button { color: #9ec2ff; }
    html.lights-off .play-controls button:hover { color: #ffc27a; }

    .no-webgl #play-experience {
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff 0 3%, #c9ccd4 9%, #6d717c 46%, #2a2c33 80%);
    }
  </style>
</head>

<body>
  <canvas id="disco-stage" aria-hidden="true"></canvas>

  <a class="play-back" href="../" aria-label="Back home" title="Back home">↓</a>

  <main class="site-shell">
    <header class="intro">
      <div class="intro-copy play-copy">
        <h1>Play</h1>
        <p>A small space for things that do not need to be useful.</p>
        <p class="play-hint">
          A mirror ball on a chain, simulated with a rigid-body physics engine.
          Grab it, swing it, throw it. Hit something hard enough and the tiles come off.
        </p>
        <nav class="play-controls" aria-label="Disco ball controls">
          <button type="button" id="btn-lights" aria-pressed="false">lights off</button>
          <span class="sep" id="sep-cut">/</span>
          <button type="button" id="btn-cut">cut the chain</button>
          <span class="sep" id="sep-reset" hidden>/</span>
          <button type="button" id="btn-reset" hidden>put it back</button>
        </nav>
      </div>

      <div class="intro-photo">
        <div id="play-experience" role="img" aria-label="Interactive disco ball"></div>
      </div>
    </header>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
    }
  }
  </script>
  <script type="module" src="./disco-ball.js"></script>
</body>
</html>
