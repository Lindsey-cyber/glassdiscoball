<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多宝格 · 马兰馨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap">
<style>
/* Layout: a 多宝格 — a curio shelf of dark wood with compartments of different sizes, one small object in each.
   Every object is a project; click it to go in. To add a project, add one compartment (see "ADDING A PROJECT" below).
   One warm light follows the pointer across the wood; the compartment under it lights up and its object lifts. */
html,body{margin:0;min-height:100%;background:#17100c}
:root{
  color-scheme:dark;
  --wood:#3b2217; --wood-hi:#5a3624; --wood-lo:#24130c;
  --recess:#120b08;
  --ivory:#efe6d2; --ink:#2a1d14;
  --fg:#efe6d2; --fg-60:rgba(239,230,210,.6); --fg-35:rgba(239,230,210,.35);
  --f-cn:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-lux:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{color:var(--fg);font-family:var(--f-cn);font-weight:300;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 70% at 50% 40%,#2a1a12 0%,#17100c 70%)}
a{color:inherit}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  width:min(1240px,calc(100vw - 48px));margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) 0 18px}
.top h1{margin:0;font-weight:500;font-size:22px;letter-spacing:.5em}
.top h1 i{font-family:var(--f-lux);font-weight:400;font-size:12px;letter-spacing:.24em;margin-left:.8em;color:var(--fg-35)}
.top p{margin:6px 0 0;font-size:12px;letter-spacing:.3em;color:var(--fg-60)}
.top a{font-size:12px;letter-spacing:.42em;color:var(--fg-60);text-decoration:none;white-space:nowrap;transition:color .3s}
.top a:hover{color:var(--fg)}

/* ---------- the shelf ---------- */
.shelf{
  --mx:50%; --my:30%;
  position:relative;width:min(1240px,calc(100vw - 48px));height:max(560px,calc(100vh - 150px));margin:0 auto calc(28px + env(safe-area-inset-bottom,0px));
  display:grid;gap:14px;padding:14px;box-sizing:border-box;border-radius:3px;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:1.05fr 1fr .9fr;
  grid-template-areas:
    "ball   ball   qinglv   qinglv   qinglv   yubi"
    "ball   ball   tianqing fenqiang fenqiang yubi"
    "topo   topo   topo     empty1   empty2   empty2";
  /* the wood: grain, a pointer-following sheen, and a carved edge */
  background:
    radial-gradient(420px 320px at var(--mx) var(--my),rgba(255,214,160,.13),transparent 70%),
    repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.09) 7px 8px,rgba(255,220,180,.025) 8px 13px),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 40%,var(--wood-lo));
  box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,180,.14),0 40px 80px -30px rgba(0,0,0,.8);
}

/* a compartment */
.cell{position:relative;display:block;overflow:hidden;text-decoration:none;border-radius:2px;
  background:radial-gradient(120% 90% at 50% -10%,#2b1b12 0%,var(--recess) 60%);
  box-shadow:inset 0 10px 18px -6px rgba(0,0,0,.85),inset 0 -2px 0 rgba(255,220,180,.06),inset 0 0 0 1px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px);animation:in 1.1s var(--ease) forwards;animation-delay:calc(var(--d,0) * 90ms + 200ms)}
@keyframes in{to{opacity:1;transform:none}}
/* the small lamp at the top of each compartment */
.cell::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 0%,rgba(255,226,180,.20),transparent 70%);opacity:.45;transition:opacity .6s var(--ease)}
.cell:hover::before,.cell:focus-visible::before{opacity:1}
.cell:focus-visible{outline:1px solid #d7b57a;outline-offset:-1px}

.obj{position:absolute;inset:0 0 34px;display:grid;place-items:center;transition:transform .9s var(--ease),filter .9s var(--ease)}
.obj svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);display:block;overflow:visible}
.cell:hover .obj,.cell:focus-visible .obj{transform:translateY(-5px) scale(1.035)}
.cell.soon .obj{filter:saturate(.6) brightness(.85)}

/* the ivory tag */
.tag{position:absolute;left:12px;bottom:10px;display:flex;align-items:baseline;gap:10px;padding:4px 10px 5px;border-radius:1px;
  background:var(--ivory);color:var(--ink);font-size:12px;letter-spacing:.3em;box-shadow:0 2px 6px rgba(0,0,0,.5);
  transform-origin:0 50%;transition:transform .6s var(--ease)}
.tag b{font-weight:500}
.tag i{font-family:var(--f-lux);font-size:10.5px;letter-spacing:.06em;opacity:.65}
.tag em{font-style:normal;font-size:10px;letter-spacing:.2em;color:#9a3d26}
.cell:hover .tag,.cell:focus-visible .tag{transform:translateX(3px)}
.note{position:absolute;right:12px;bottom:12px;font-size:11px;letter-spacing:.3em;color:var(--fg-35);opacity:0;transition:opacity .5s var(--ease)}
.cell:hover .note,.cell:focus-visible .note{opacity:1}

/* the four rooms are one set: a brass plaque under them names the series */
.series{grid-area:2/3/3/7;align-self:end;justify-self:center;position:relative;bottom:-12px;z-index:3;pointer-events:none;
  padding:2px 12px;font-size:10.5px;letter-spacing:.5em;color:#2a1d14;border-radius:1px;
  background:linear-gradient(180deg,#d9b779,#a8823f);box-shadow:0 1px 3px rgba(0,0,0,.6)}

/* an empty compartment, kept for what comes next */
.empty{opacity:0;animation:in 1.1s var(--ease) forwards;animation-delay:calc(var(--d,0) * 90ms + 200ms);
  background:radial-gradient(120% 90% at 50% -10%,#24170f 0%,var(--recess) 60%);border-radius:2px;
  box-shadow:inset 0 10px 18px -6px rgba(0,0,0,.85),inset 0 0 0 1px rgba(0,0,0,.5);display:grid;place-items:center}
.empty span{writing-mode:vertical-rl;font-size:12px;letter-spacing:.6em;color:rgba(239,230,210,.16)}

@media (max-width:820px){
  .top{flex-direction:column;align-items:flex-start;gap:12px}
  .shelf{height:auto;gap:10px;padding:10px;
    grid-template-columns:1fr 1fr;
    grid-template-rows:320px 170px 190px 170px 190px 120px;
    grid-template-areas:
      "ball ball"
      "qinglv qinglv"
      "tianqing yubi"
      "fenqiang fenqiang"
      "topo topo"
      "empty1 empty2"}
  .series{grid-area:4/1/5/3}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){ .cell,.empty{animation:none;opacity:1;transform:none} .obj,.tag{transition:none} }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>多宝格<i>A curio shelf</i></h1>
    <p>一格一物，都不必有用 · Small things that do not need to be useful</p>
  </div>
  <a href="index.html">正面 ↗</a>
</header>

<!--
  ADDING A PROJECT
  1. Add an <a class="cell"> with a grid-area name, an <svg> object, and a .tag.
  2. Give that name a place in grid-template-areas (desktop and the mobile block in the CSS above),
     e.g. take over "empty1" or "empty2", or add a row.
-->
<main class="shelf" id="shelf">

  <a class="cell" href="liuguang.html" style="grid-area:ball;--d:0">
    <div class="obj"><svg id="obj-ball" viewBox="0 0 300 300" preserveAspectRatio="xMidYMin slice" aria-hidden="true"></svg></div>
    <span class="tag"><b>流光</b><i>Mirror ball</i></span>
    <span class="note">拖它 · 甩它 · 摔碎它</span>
  </a>

  <a class="cell" href="qinglv.html" style="grid-area:qinglv;--d:1">
    <div class="obj"><svg viewBox="0 0 420 150" aria-hidden="true">
      <defs>
        <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe3c4"/><stop offset="1" stop-color="#dccaa0"/></linearGradient>
        <linearGradient id="roller" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a2015"/><stop offset=".5" stop-color="#8a5a3a"/><stop offset="1" stop-color="#2a160e"/></linearGradient>
        <clipPath id="scrollclip"><rect x="40" y="28" width="340" height="94"/></clipPath>
      </defs>
      <rect x="40" y="28" width="340" height="94" fill="url(#silk)"/>

        <circle cx="320" cy="56" r="8" fill="#c9553a" opacity=".85"/>
        <path d="M40 92 C70 60 88 52 112 76 S150 40 180 70 S230 46 262 74 S320 58 350 80 L380 72 V122 H40Z" fill="#9fb8a0" opacity=".6"/>
        <path d="M40 104 C62 70 82 62 104 90 S140 52 170 86 S214 66 240 92 S300 62 330 94 L380 90 V122 H40Z" fill="#3f8a7c" stroke="#d2a752" stroke-width="1.4"/>
        <path d="M40 112 C70 92 96 88 124 106 S190 84 222 106 S300 92 340 108 L380 104 V122 H40Z" fill="#1d5b6a" stroke="#d2a752" stroke-width="1.4"/>
        <path d="M40 120 C90 110 140 114 190 118 S300 110 380 116 V122 H40Z" fill="#b5803f"/>
      </g>

    </svg></div>

  <a class="cell" href="yubi.html" style="grid-area:yubi;--d:2">
    <div class="obj"><svg viewBox="0 0 160 300" aria-hidden="true">
      <defs>
        <radialGradient id="jade" cx=".4" cy=".35" r=".8">
          <stop offset="0" stop-color="#e3eedc"/><stop offset=".45" stop-color="#a9c6a6"/><stop offset="1" stop-color="#4c6e52"/>
        </radialGradient>
        <pattern id="grain" width="9" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4.5" cy="4" r="1.7" fill="#ffffff" opacity=".22"/><circle cx="0" cy="0" r="1.7" fill="#ffffff" opacity=".22"/><circle cx="9" cy="0" r="1.7" fill="#ffffff" opacity=".22"/>
        </pattern>
      </defs>
      <path d="M80 70 a62 62 0 1 0 .01 0 Z M80 112 a20 20 0 1 1 -.01 0 Z" fill="url(#jade)" fill-rule="evenodd"/>
      <path d="M80 76 a56 56 0 1 0 .01 0 Z M80 106 a26 26 0 1 1 -.01 0 Z" fill="url(#grain)" fill-rule="evenodd"/>
      <path d="M80 70 a62 62 0 1 0 .01 0 Z M80 112 a20 20 0 1 1 -.01 0 Z" fill="none" stroke="#e8f2e0" stroke-opacity=".35" stroke-width="1" fill-rule="evenodd"/>
      <path d="M52 190 Q80 178 108 190 L114 206 H46 Z" fill="#4a2a1b"/>
      <rect x="40" y="206" width="80" height="7" rx="2" fill="#2f1a10"/>
    </svg></div>
    <span class="tag"><b>玉璧</b><i>Bi</i></span>

  </a>

  <a class="cell" href="tianqing.html" style="grid-area:tianqing;--d:3">
    <div class="obj"><svg viewBox="0 0 200 150" aria-hidden="true">
      <defs>

          <stop offset="0" stop-color="#7f9e9b"/><stop offset=".35" stop-color="#c3d7d2"/><stop offset=".6" stop-color="#a9c0bc"/><stop offset="1" stop-color="#6e8c89"/>

      <ellipse cx="100" cy="132" rx="56" ry="5" fill="#000" opacity=".35"/>
    </svg></div>

    <div class="obj"><svg viewBox="0 0 300 180" aria-hidden="true">
      <defs>
        <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ebe0"/><stop offset=".45" stop-color="#9fb187"/><stop offset="1" stop-color="#3c4f38"/></linearGradient>
        <clipPath id="fanclip"><path id="fan" d="M70 130 A110 110 0 0 1 230 130 L190 150 A60 60 0 0 0 110 150 Z"/></clipPath>
        <filter id="blur3"><feGaussianBlur stdDeviation="2.5"/></filter>
      </defs>
      <rect x="40" y="20" width="220" height="140" fill="#e6e1d6"/>
      <rect x="40" y="20" width="220" height="10" fill="#2f3134"/>
      <g opacity=".35" filter="url(#blur3)" fill="#6f6c66">
        <rect x="58" y="30" width="5" height="130"/>
        <ellipse cx="88" cy="70" rx="30" ry="5" transform="rotate(24 88 70)"/><ellipse cx="90" cy="84" rx="26" ry="4" transform="rotate(44 90 84)"/>
        <ellipse cx="238" cy="96" rx="28" ry="5" transform="rotate(-30 238 96)"/>
      </g>
      <g transform="translate(0,-28)">
        <use href="#fan" fill="#2e2724" transform="translate(0,0)"/>
        <g clip-path="url(#fanclip)">
          <rect x="60" y="60" width="180" height="100" fill="url(#garden)"/>
          <g stroke="#2e2724" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M100 108 L122 96 L118 120 M122 96 L150 92 L156 112 M150 92 L178 98 L176 118 M178 98 L202 108 L190 124 M118 120 L140 128 M156 112 L176 118 M86 124 L118 120"/>
          </g>

      </g>
    </svg></div>
    <span class="tag"><b>粉墙</b><i>Garden wall</i></span>
    <span class="note">贰</span>
  </a>

  <div class="series" aria-hidden="true">四面 · 中国色</div>

  <a class="cell soon" href="#" aria-disabled="true" style="grid-area:topo;--d:5" onclick="return false">
    <div class="obj"><svg id="obj-mobius" viewBox="-150 -78 300 156" aria-hidden="true"></svg></div>
    <span class="tag"><b>拓扑</b><i>Möbius</i><em>制作中</em></span>
    <span class="note">只有一个面的纸带</span>
  </a>

  <div class="empty" style="grid-area:empty1;--d:6" aria-hidden="true"><span>虚位</span></div>
  <div class="empty" style="grid-area:empty2;--d:7" aria-hidden="true"><span>以待</span></div>
</main>

<script>
(() => {
const NS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mk = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

/* one warm light follows the pointer over the wood */
const shelf = document.getElementById("shelf");
addEventListener("pointermove", (e) => {
  const r = shelf.getBoundingClientRect();
  shelf.style.setProperty("--mx", (e.clientX - r.left) + "px");
  shelf.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });

/* 流光: a mirror ball on a chain, throwing turning spots onto the back of its compartment */
const ballSvg = document.getElementById("obj-ball");
const spin = mk(ballSvg, "g", {});
{
  const R = rng(11), cx = 150, cy = 120;
  const colors = ["#fff0d6", "#ff6ec4", "#62d6ff", "#fff0d6", "#fff0d6"];
  for (let i = 0; i < 260; i++) {
    const a = R() * Math.PI * 2, r = 62 + Math.pow(R(), .8) * 280, s = 2 + R() * 3.6 * (0.6 + r / 300);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .85;
    mk(spin, "rect", { x: (x - s / 2).toFixed(1), y: (y - s / 2).toFixed(1), width: s.toFixed(1), height: (s * (1 + R() * .6)).toFixed(1), rx: .8,
      fill: colors[(R() * colors.length) | 0], opacity: (.25 + R() * .6).toFixed(2), transform: `rotate(${(a * 57.3).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})` });
  }
  mk(ballSvg, "line", { x1: cx, y1: -40, x2: cx, y2: cy - 52, stroke: "#8f8f95", "stroke-width": 1.4 });
  mk(ballSvg, "rect", { x: cx - 7, y: cy - 54, width: 14, height: 6, rx: 2, fill: "#b8b8be" });
  const defs = mk(ballSvg, "defs", {});
  const g = mk(defs, "radialGradient", { id: "ballg", cx: ".36", cy: ".3", r: ".8" });
  [["0", "#ffffff"], [".22", "#c4c5cc"], [".62", "#43444c"], ["1", "#141418"]].forEach(([o, c]) => mk(g, "stop", { offset: o, "stop-color": c }));
  mk(defs, "clipPath", { id: "ballclip" }).appendChild(Object.assign(document.createElementNS(NS, "circle"), {})).setAttribute("r", "48");
  defs.lastChild.firstChild.setAttribute("cx", cx); defs.lastChild.firstChild.setAttribute("cy", cy);
  mk(ballSvg, "circle", { cx, cy, r: 48, fill: "url(#ballg)" });
  const tiles = mk(ballSvg, "g", { "clip-path": "url(#ballclip)" });
  for (let row = -6; row <= 6; row++) {
    const y = cy + Math.sin(row / 6.5 * Math.PI / 2) * 48, w = Math.sqrt(Math.max(0, 48 * 48 - (y - cy) ** 2)), n = Math.max(3, Math.round(w / 4.2));
    for (let k = 0; k < n; k++) {
      const x = cx - w + (k + .5) * (2 * w / n);
      const lit = R() < .08 ? (R() < .5 ? "#ffffff" : colors[1 + ((R() * 2) | 0)]) : null;
      mk(tiles, "rect", { x: (x - 2.6).toFixed(1), y: (y - 2.6).toFixed(1), width: 5.2 * (1 - Math.abs(x - cx) / 60), height: 4.6, fill: lit || "none",
        stroke: "rgba(0,0,0,.35)", "stroke-width": .6, opacity: lit ? .9 : 1 });
    }
  }
}

/* 天青: crackle on the cup */
{
  const g = document.getElementById("cupcrackle"), R = rng(5);
  let d = "";
  for (let i = 0; i < 26; i++) {
    let x = 30 + R() * 140, y = 52 + R() * 70;
    d += `M${x.toFixed(1)} ${y.toFixed(1)}`;
    for (let k = 0; k < 4; k++) { x += (R() - .5) * 26; y += (R() - .5) * 18; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
  }
  mk(g, "path", { d });
}

/* 拓扑: a Möbius strip, drawn as shaded quads sorted back to front */
const mob = document.getElementById("obj-mobius");
const quads = [];
const N = 120;
for (let i = 0; i < N; i++) quads.push(mk(mob, "path", { "stroke-width": .4 }));
function mobius(t) {
  const Rr = 80, w = 27, tilt = 1.0 + Math.sin(t * .3) * .08, ay = t * .35;
  const ct = Math.cos(tilt), st = Math.sin(tilt), cy = Math.cos(ay), sy = Math.sin(ay);
  const P = (u, v) => {
    const r = Rr + v * Math.cos(u / 2);
    const x = r * Math.cos(u), y = r * Math.sin(u), z = v * Math.sin(u / 2);
    const x1 = x * cy - y * sy, y1 = x * sy + y * cy;          // spin about the strip's own axis
    return [x1, y1 * ct - z * st, y1 * st + z * ct];            // tilt toward the viewer: [screen x, screen y, depth]
  };
  const L = [-.4, -.6, .7], ll = Math.hypot(...L);
  const list = [];
  for (let i = 0; i < N; i++) {
    const u0 = i / N * Math.PI * 2, u1 = (i + 1) / N * Math.PI * 2;
    const a = P(u0, -w), b = P(u1, -w), c = P(u1, w), d = P(u0, w);
    const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [d[0] - a[0], d[1] - a[1], d[2] - a[2]];
    const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    const nl = Math.hypot(...n) || 1;
    // one-sided surface: light it the same whichever way the normal points
    const shade = Math.abs((n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / (nl * ll));
    list.push({ pts: [a, b, c, d], depth: (a[2] + b[2] + c[2] + d[2]) / 4, shade, u: u0 });
  }
  list.sort((p, q) => q.depth - p.depth);   // far first (larger depth is further: screen y grows downward)
  list.forEach((q, k) => {
    const el = quads[k], [a, b, c, d] = q.pts;
    el.setAttribute("d", `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}L${d[0].toFixed(1)} ${d[1].toFixed(1)}Z`);
    const l = .25 + q.shade * .75, hue = 168 + Math.sin(q.u) * 16;
    el.setAttribute("fill", `hsl(${hue.toFixed(0)} 30% ${(16 + l * 56).toFixed(0)}%)`);
    el.setAttribute("stroke", el.getAttribute("fill"));
  });
}
let t0 = performance.now();
