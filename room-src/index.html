<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>竹里馆 · 马兰馨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&family=Ma+Shan+Zheng&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e1cf;touch-action:none;
    font-family:"Noto Serif SC","Songti SC",serif;font-weight:300;color:#f4ecd8;-webkit-font-smoothing:antialiased}
  #view{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;cursor:grab}
  #view.dragging{cursor:grabbing}
  #view.pointing{cursor:pointer}

  .ui{position:fixed;z-index:5;font-size:12px;letter-spacing:.32em;text-shadow:0 1px 8px rgba(0,0,0,.45)}
  .ui a{color:inherit;text-decoration:none;opacity:.8;transition:opacity .3s}
  .ui a:hover{opacity:1}
  .tl{top:calc(22px + env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px))}
  .tl b{font-weight:500;letter-spacing:.5em}
  .tl i{font-family:"Bodoni Moda",Georgia,serif;font-size:11px;letter-spacing:.14em;margin-left:1em;opacity:.75}
  .tr{top:calc(22px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:22px}
  .hint{bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);white-space:nowrap;opacity:.85;transition:opacity 1.2s}
  .hint.gone{opacity:0}
  .hint .m{display:none}
  @media (hover:none){ .hint .d{display:none} .hint .m{display:inline} }

  /* paper label that appears beside an object */
  #tag{position:fixed;z-index:6;left:0;top:0;pointer-events:none;writing-mode:vertical-rl;padding:12px 7px 9px;
    background:#f4ecd8;color:#231a14;font-size:15px;letter-spacing:.34em;font-weight:500;
    box-shadow:2px 4px 14px rgba(0,0,0,.4),inset 0 0 0 1px rgba(160,120,70,.35);
    opacity:0;transform:translate(-50%,-110%) translateY(6px);transition:opacity .35s,transform .45s cubic-bezier(.22,1,.36,1)}
  #tag.on{opacity:1;transform:translate(-50%,-110%)}
  #tag small{display:block;margin-top:.6em;font-size:10.5px;letter-spacing:.2em;color:#a8321f;font-weight:400}
  #tag::after{content:"";display:block;width:10px;height:10px;margin-top:8px;background:#a8321f;border-radius:1px}

  /* loading: a sheet of paper that lifts away */
  #veil{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#e9e1cf;color:#231a14;transition:opacity 1.6s ease}
  #veil.gone{opacity:0;pointer-events:none}
  #veil .c{display:flex;flex-direction:column;align-items:center;gap:18px}
  #veil h1{margin:0;font-family:"Ma Shan Zheng","STKaiti","KaiTi",serif;font-weight:400;font-size:46px;letter-spacing:.3em;text-indent:.3em}
  #veil p{margin:0;font-size:12px;letter-spacing:.4em;color:rgba(35,26,20,.6)}
  #veil .bar{width:160px;height:1px;background:rgba(35,26,20,.15)}
  #veil .bar i{display:block;height:100%;width:0;background:#a8321f;transition:width .3s}
  #veil .err{display:none;max-width:22rem;text-align:center;line-height:2}
  #veil.failed .err{display:block}
  #fade{position:fixed;inset:0;z-index:9;background:#f4ecd8;opacity:0;pointer-events:none;transition:opacity .9s ease}
  #fade.on{opacity:1}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="竹里馆：一间晨光里的竹屋，屋中立着一座多宝格。拖动环顾，行走，点物件进入项目。"></canvas>

<div class="ui tl"><b>竹里馆</b><i>Claude vibe-coding projects</i></div>
<nav class="ui tr"><a href="../play.html">平面版</a><a href="../index.html">正面 ↗</a></nav>
<div class="ui hint" id="hint"><span class="d">拖动环顾 · W A S D 或滚轮行走 · 点物入内</span><span class="m">拖动环顾 · 点地面行走 · 点物入内</span></div>
<div id="tag"></div>
<div id="fade"></div>

<div id="veil">
  <div class="c">
    <h1>竹里馆</h1>
    <p>独坐幽篁里</p>
    <div class="bar"><i id="progress"></i></div>
    <p class="err">这间屋子需要 WebGL。<br><a href="../play.html">去平面版多宝格 →</a></p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
